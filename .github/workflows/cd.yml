# ============================================================
# CD Pipeline — Deploy to Production
# Triggers automatically after CI passes on main,
# or can be triggered manually via workflow_dispatch.
# ============================================================
name: CD — Deploy

on:
  # Auto-deploy when CI workflow completes successfully on main
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Manual trigger — choose environment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  IMAGE_NAME: math-project
  REGISTRY: ghcr.io

jobs:
  # ── Guard: only proceed if CI passed ────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding with deploy
        run: echo "CI succeeded. Starting deployment."

  # ── Deploy via SSH to a VPS / server ────────────────────────
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: check-ci
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            # Log in to GHCR on the server
            echo "${{ secrets.GHCR_PAT }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Stopping old container (if any)..."
            docker stop math-project-app 2>/dev/null || true
            docker rm   math-project-app 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name math-project-app \
              --network proxy-net \
              --restart unless-stopped \
              -p 8080:80 \
              -e VITE_SITENAME="${{ vars.VITE_SITENAME || 'Math Assignment Become to Backend' }}" \
              "$IMAGE"

            echo "Pruning old images..."
            docker image prune -f

            echo "Deploy complete ✅"

      - name: Post-deploy health check
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ vars.APP_PORT || 8080 }}"
          URL="http://${HOST}:${PORT}/"
          echo "Health-checking $URL ..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ App is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1
